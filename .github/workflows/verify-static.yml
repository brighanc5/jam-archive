name: Validate public Jam Archive
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: public-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  public-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and verify whole public site
        run: bash scripts/build_public.sh
      - name: Upload compiled site for inspection (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: jam-archive-public-site
          path: site/
          retention-days: 7
